name: Deploy

# Chaîne complète : push sur main -> image construite sur GitHub -> publiée sur
# GHCR -> le VPS la tire et redémarre. Le VPS ne compile jamais.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   VPS_HOST      IP ou domaine du VPS Hostinger
#   VPS_USER      utilisateur SSH (ex. deploy, ou root)
#   VPS_SSH_KEY   clé privée SSH complète, en-têtes comprises
#   VPS_PORT      (optionnel) port SSH, 22 par défaut
#   VPS_APP_DIR   (optionnel) chemin sur le VPS, /opt/copilote-social-media par défaut
#
# Voir DEPLOY.md pour la préparation du VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un seul déploiement à la fois : deux pushes rapprochés ne se marchent pas
  # dessus sur la machine.
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mêmes garde-fous qu'en CI : on ne construit pas une image cassée.
      - run: npm run lint
      - run: npx tsc --noEmit

      - id: meta
        run: |
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          # Le cache GitHub évite de tout recompiler à chaque push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      # Un diagnostic avant d'essayer, parce que « i/o timeout » ne dit rien
      # d'exploitable. Le cas qu'on cherche surtout : un nom qui porte à la
      # fois une IPv4 et une IPv6 alors que le serveur n'écoute SSH que sur
      # l'une des deux. Le robot choisit alors parfois la mauvaise, et les
      # paquets partent dans le vide — ce qui explique qu'un déploiement passe
      # et que le suivant échoue sans que rien n'ait changé.
      #
      # L'étape essaie chaque famille, garde celle qui répond, et la transmet
      # à la connexion. Les adresses sont masquées avant tout affichage :
      # l'adresse d'un serveur n'a pas à traîner dans un journal.
      - name: Vérifier que le VPS est joignable
        id: cible
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -uo pipefail

          if [ -z "$VPS_HOST" ]; then
            echo "Le secret VPS_HOST est vide : il n'y a rien à joindre."
            exit 1
          fi
          echo "::add-mask::$VPS_HOST"

          essaie() {
            # nc plutôt que /dev/tcp : il gère les deux familles d'adresses
            # sans traitement particulier.
            timeout 12 nc -z -w 8 "$1" "$VPS_PORT" >/dev/null 2>&1
          }

          if [[ "$VPS_HOST" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            v4="$VPS_HOST"; v6=""
            echo "Adresse : une IPv4 écrite en clair, rien à résoudre."
          else
            v4="$(getent ahostsv4 "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u | head -1)"
            v6="$(getent ahostsv6 "$VPS_HOST" 2>/dev/null | awk '{print $1}' | grep -v '^::ffff:' | sort -u | head -1)"
            if [ -z "$v4" ] && [ -z "$v6" ]; then
              echo "Le nom du serveur ne se résout pas. Le secret VPS_HOST est mal écrit,"
              echo "ou le domaine ne pointe plus nulle part."
              exit 1
            fi
            echo "Adresse : le nom se résout${v4:+ en IPv4}${v6:+ et en IPv6}."
          fi
          [ -n "$v4" ] && echo "::add-mask::$v4"
          [ -n "$v6" ] && echo "::add-mask::$v6"

          retenue=""
          if [ -n "$v4" ] && essaie "$v4"; then
            echo "IPv4 · port $VPS_PORT : ouvert."
            retenue="$v4"
          elif [ -n "$v4" ]; then
            echo "IPv4 · port $VPS_PORT : aucune réponse en 8 s."
          fi

          if [ -n "$v6" ]; then
            if essaie "$v6"; then
              echo "IPv6 · port $VPS_PORT : ouvert."
              [ -z "$retenue" ] && retenue="$v6"
            else
              echo "IPv6 · port $VPS_PORT : aucune réponse en 8 s."
              [ -n "$retenue" ] && echo "→ On passera par l'IPv4, qui répond."
            fi
          fi

          if [ -z "$retenue" ]; then
            echo
            echo "Aucune adresse ne répond sur le port $VPS_PORT."
            echo "Les paquets partent et personne ne répond : quelque chose les jette en"
            echo "silence. Un service arrêté répondrait « connexion refusée » tout de suite,"
            echo "et le site public tourne — c'est donc le port SSH seul qui est filtré."
            echo
            echo "À vérifier sur la machine, dans cet ordre :"
            echo "  ufw status                     — un pare-feu local actif ;"
            echo "  fail2ban-client status sshd    — une adresse bannie ;"
            echo "  ss -lntp | grep :$VPS_PORT     — sshd écoute-t-il vraiment là ;"
            echo "  iptables -L INPUT -n           — une règle DROP posée à la main."
            exit 1
          fi

          echo "host=$retenue" >> "$GITHUB_OUTPUT"

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1
        env:
          # Jeton temporaire, valable le temps du job : le VPS n'a donc aucun
          # identifiant stocké et le paquet GHCR peut rester privé.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # L'adresse retenue par la vérification ci-dessus, et non le secret
          # brut : si le nom porte une IPv6 muette, on passe par l'IPv4.
          host: ${{ steps.cible.outputs.host }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Une poignée de main lente ne doit pas compter comme une panne.
          # « script_stop » n'existe plus dans la version 1 de l'action : il
          # était accepté sans rien faire, et le « set -euo pipefail » du
          # script ci-dessous est ce qui l'arrête réellement au premier échec.
          timeout: 60s
          command_timeout: 15m
          envs: GITHUB_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/copilote-social-media' }}"
            cd "$APP_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # docker-compose.yml vit dans le repo : on le resynchronise avant
            # de déployer, sinon un changement de compose ne partirait jamais.
            git fetch --depth 1 origin main
            git reset --hard origin/main

            # Une nouvelle version peut introduire une variable que le .env du
            # serveur ne connaît pas encore. On la crée ici plutôt que de
            # laisser le déploiement échouer sur une machine déjà en service.
            # Un secret généré n'est jamais réécrit : les données existantes
            # deviendraient illisibles.
            if ! grep -q '^DB_PASSWORD=' .env; then
              echo "DB_PASSWORD=$(openssl rand -hex 24)" >> .env
              echo "DB_PASSWORD généré"
            fi

            # Épingle la version déployée au commit, pour que /api/health dise
            # la vérité et qu'un rollback soit possible.
            sed -i "s|^APP_VERSION=.*|APP_VERSION=${GITHUB_SHA::7}|" .env

            # Validation AVANT de toucher à quoi que ce soit. « docker compose
            # up » recrée les conteneurs : s'il échoue sur une variable
            # manquante, l'ancienne version est déjà détruite et le site tombe.
            # Cette vérification échoue sans rien arrêter.
            if ! docker compose config --quiet; then
              echo "Configuration invalide — rien n'a été modifié, l'ancienne version tourne toujours."
              exit 1
            fi

            # Le serveur web impose sa propre limite de taille, indépendante de
            # l'application : une vidéo est refusée avant même de l'atteindre.
            # Le déploiement répare ce qu'il sait réparer plutôt que d'attendre
            # qu'on relance l'installation à la main.
            DOMAIN="$(grep '^APP_DOMAIN=' .env | cut -d= -f2)"
            [ -n "$DOMAIN" ] && bash scripts/ensure-nginx.sh "$DOMAIN" || true

            docker compose pull
            docker compose up -d --remove-orphans

            # Attend que la sonde passe au vert avant de déclarer le succès.
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' copilote-social-media)" = "healthy" ]; then
                echo "Déploiement sain (${GITHUB_SHA::7})"
                docker image prune -f
                docker logout ghcr.io >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 5
            done

            echo "L'app n'est pas devenue saine en 150 s — logs :"
            docker compose logs --tail 80 app

            # Ne jamais laisser le domaine sans rien derrière : sur une machine
            # partagée, un port libéré peut être capté par un autre service et
            # afficher le mauvais site. On revient à la version précédente.
            PREV="$(docker images --format '{{.Repository}}:{{.Tag}}' \
              ghcr.io/emmanueltaochy/copilote-social-media \
              | grep -v ':latest' | head -n1 || true)"
            if [ -n "$PREV" ]; then
              echo "Retour à $PREV"
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$PREV|" .env
              docker compose up -d --remove-orphans || true
            fi

            docker logout ghcr.io >/dev/null 2>&1 || true
            exit 1
