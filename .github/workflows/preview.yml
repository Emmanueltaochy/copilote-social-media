name: Préversion

# La nouvelle version, en ligne sur preview.taochyagency.com, à côté de la
# production et sur une copie de sa base. Se déclenche à chaque push sur la
# branche de refonte, ou à la main (onglet Actions) avec « recopier la base ».
# La production n'est jamais touchée : voir scripts/preview-vps.sh.

on:
  push:
    branches: [claude/refonte-interface]
  workflow_dispatch:
    inputs:
      recopier_la_base:
        description: "Recopier la base de production dans la préversion"
        type: boolean
        default: false

concurrency:
  group: deploy-preview
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - id: meta
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Jamais « latest » : c'est l'étiquette de la production.
          tags: ${{ steps.meta.outputs.image }}:preview
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Les secrets SSH du VPS vivent dans cet environnement.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Déployer la préversion
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCHE: ${{ github.ref_name }}
          REFRESH: ${{ inputs.recopier_la_base && '--refresh-db' || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          envs: GITHUB_SHA,GHCR_USER,GHCR_TOKEN,BRANCHE,REFRESH
          script: |
            set -euo pipefail
            DIR=/opt/pilot-preview
            if [ ! -d "$DIR/.git" ]; then
              git clone -q --depth 1 -b "$BRANCHE" https://github.com/Emmanueltaochy/copilote-social-media.git "$DIR"
            else
              git -C "$DIR" fetch -q --depth 1 origin "$BRANCHE"
              git -C "$DIR" reset -q --hard FETCH_HEAD
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            GITHUB_SHA="${GITHUB_SHA::7}" bash "$DIR/scripts/preview-vps.sh" --domain preview.taochyagency.com $REFRESH
            docker logout ghcr.io >/dev/null 2>&1 || true
